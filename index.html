<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Astro 365</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-0:#07231a;
    --pitch-1:#0d3327;
    --pitch-2:#134a35;
    --line: rgba(255,255,255,0.08);
    --gold:#e0b45a;
    --gold-bright:#f3cd7a;
    --chalk:#eef3ee;
    --chalk-dim:#9db3a8;
    --red:#c9584f;
    --blue-ish:#5aa9c9;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;}
  #app{
    font-family: 'Noto Serif', 'Be Vietnam Pro', Georgia, 'Segoe UI', Arial, serif;
    background: repeating-linear-gradient(
        90deg,
        var(--pitch-1) 0px,
        var(--pitch-1) 90px,
        var(--pitch-2) 90px,
        var(--pitch-2) 180px
      );
    background-color: var(--pitch-1);
    color: var(--chalk);
    min-height: 100vh;
    padding: 18px 14px 60px;
  }
  .wrap{max-width: 980px; margin: 0 auto;}

  /* ---- header ---- */
  header{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 14px; margin-bottom: 18px;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .whistle{font-size: 26px;}
  h1{
    font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif;
    letter-spacing: 2px; text-transform: uppercase;
    font-size: 22px; margin:0; color: var(--gold-bright);
    font-weight:700;
  }
  .subtitle{font-size:12px; color:var(--chalk-dim); font-style:italic; margin-top:2px;}
  .hdr-controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  input[type=text], input[type=password], input[type=number], select{
    font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif;
    background: var(--pitch-0); color: var(--chalk);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; font-size: 13px;
  }
  input:focus, select:focus, button:focus{outline: 2px solid var(--gold-bright); outline-offset:1px;}
  button{
    font-family:'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; cursor:pointer;
    border:none; border-radius:6px; padding: 7px 12px; font-size:13px; font-weight:600;
    background: var(--gold); color: var(--pitch-0);
    transition: transform .08s ease, background .15s ease;
  }
  button:hover{background:var(--gold-bright);}
  button:active{transform: scale(0.97);}
  button.ghost{background:transparent; border:1px solid var(--chalk-dim); color:var(--chalk);}
  button.ghost:hover{border-color:var(--gold-bright); color:var(--gold-bright); background:transparent;}
  button.danger{background:var(--red); color:#fff;}
  .badge{
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
    padding: 4px 8px; border-radius: 20px; font-weight:700;
  }
  .badge.admin{background:var(--gold); color:var(--pitch-0);}
  .badge.guest{background:transparent; border:1px solid var(--chalk-dim); color:var(--chalk-dim);}

  /* ---- sync status ---- */
  .sync-status{
    font-size:11px; padding:4px 10px; border-radius:20px; font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;
    border:1px solid var(--line); color:var(--chalk-dim);
  }
  .sync-status.ok{color:var(--gold-bright); border-color:var(--gold);}
  .sync-status.err{color:var(--red); border-color:var(--red);}

  /* ---- tabs ---- */
  nav.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom: 18px; padding-bottom:4px;}
  nav.tabs button{
    background: var(--pitch-0); color: var(--chalk-dim); white-space:nowrap;
    border:1px solid var(--line);
  }
  nav.tabs button.active{background: var(--gold); color: var(--pitch-0); border-color:var(--gold);}

  section.panel{display:none;}
  section.panel.active{display:block; animation: fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);}}

  .card{
    background: rgba(7,35,26,0.72);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .card h2{
    font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif; text-transform:uppercase; letter-spacing:1.5px;
    font-size:14px; color:var(--gold-bright); margin: 0 0 12px; padding-bottom:8px;
    border-bottom: 1px dashed var(--line);
  }
  .hint{font-size:11.5px; color:var(--chalk-dim); margin: -6px 0 12px;}

  .odd-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .odd-row:last-child{border-bottom:none;}
  .odd-label{flex: 1 1 160px; font-size:14px;}
  .odd-value{
    font-family: 'Consolas','Menlo',monospace; font-weight:700; font-size:16px;
    color: var(--gold-bright); min-width: 58px; text-align:center;
    background: var(--pitch-0); border-radius:6px; padding:4px 8px;
  }
  .odd-value.empty{color:var(--chalk-dim); font-weight:400; font-size:12px;}
  input.odd-edit{width:64px; text-align:center;}
  .stake-group{display:flex; gap:6px; align-items:center;}
  .stake-group input{width:78px;}

  .result-grid{display:flex; gap:10px; flex-wrap:wrap;}
  .result-cell{
    flex:1 1 150px; background: var(--pitch-0); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px;
  }
  .result-cell .rc-title{font-size:12px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}

  .ou-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .ou-table th{
    text-align:left; font-size:11px; text-transform:uppercase; color:var(--chalk-dim);
    letter-spacing:1px; padding: 4px 6px; border-bottom:1px solid var(--line);
  }
  .ou-table td{padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:middle;}

  .cs-picker{display:flex; gap:10px; align-items:end; flex-wrap:wrap; margin-bottom:12px;}
  .cs-picker label{font-size:11px; color:var(--chalk-dim); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:1px;}
  .cs-chip-wrap{display:flex; flex-wrap:wrap; gap:6px; max-height:140px; overflow-y:auto; padding:10px;
    background:var(--pitch-0); border-radius:8px; border:1px solid var(--line);}
  .cs-chip{
    font-family:'Consolas',monospace; font-size:12px; background: var(--pitch-2);
    border:1px solid var(--line); border-radius: 5px; padding:4px 8px; cursor:pointer; color:var(--chalk);
  }
  .cs-chip:hover{border-color:var(--gold-bright);}
  .cs-chip b{color:var(--gold-bright); margin-left:5px;}
  .empty-note{font-size:12px; color:var(--chalk-dim); font-style:italic;}

  .players-cols{display:flex; gap:22px; flex-wrap:wrap;}
  .players-col{flex:1 1 280px;}
  .players-col h3{font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--blue-ish); margin: 0 0 6px;}
  .players-col.b h3{color:var(--red);}

  table.bets{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.bets th{text-align:left; padding:6px; color:var(--chalk-dim); border-bottom:1px solid var(--gold); font-size:11px; text-transform:uppercase;}
  table.bets td{padding:6px; border-bottom:1px solid var(--line);}
  table.bets tr:hover td{background: rgba(255,255,255,0.03);}

  .custom-add{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .custom-add input[type=text]{flex:1 1 200px;}

  .toast{
    position:fixed; bottom:18px; right:18px; background: var(--gold); color:var(--pitch-0);
    padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,0.4);
    opacity:0; transform: translateY(8px); transition: all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .row-remove{background:transparent; color:var(--chalk-dim); border:none; font-size:15px; padding:2px 6px;}
  .row-remove:hover{color:var(--red); background:transparent;}

  .my-limit{font-size:12px; color:var(--gold-bright); margin: -8px 0 4px; font-weight:600;}
  .stake-summary{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .limit-chip{
    font-size:11.5px; font-family:'Consolas','Menlo',monospace; padding:4px 9px;
    background: var(--pitch-0); border:1px solid var(--line); border-radius:20px; color:var(--chalk);
  }
  .limit-chip.maxed{border-color:var(--red); color:var(--red);}
  .limit-chip.quiet{color:var(--chalk-dim); font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;}

  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--pitch-0); border-radius:4px;}

  @media (max-width:520px){
    .odd-row{align-items:flex-start;}
    h1{font-size:17px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="whistle">⚽</span>
        <div>
          <h1>Astro 365</h1>
          <div class="subtitle">Friendly match — Team A vs Team B, 3 rounds</div>
        </div>
      </div>
      <div class="hdr-controls">
        <span id="syncStatus" class="sync-status">syncing…</span>
        <span id="modeBadge" class="badge guest">Guest view</span>
        <input id="nameInput" type="text" placeholder="Your name" style="width:110px;">
        <input id="adminCode" type="password" placeholder="Admin code" style="width:90px;">
        <button id="loginBtn" class="ghost">Log in</button>
        <button id="logoutBtn" class="ghost" style="display:none;">Log out</button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <div id="panels"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================= DATA MODEL ============================= */
const TEAM_A_PLAYERS = ["Quyền","Sơn","Trung (1)","Hải","Trung (2)","Dũng","Quân","A. Trí","Tùng","Quyết"];
const TEAM_B_PLAYERS = ["Khoa","Bảo","Tuấn","Tuấn Anh","Thế Anh","Cường","Việt","Bond","A. Tân"];
const ADMIN_CODE = "123";
const STAKE_LIMIT = 100;

const MAIN_OU_LIMIT = 12.5;
const ROUND_OU_LIMIT = 20.5;
const MAX_GOALS = 20;

function ouLines(limit){
  const arr = [];
  for(let l=0.5; l<=limit+0.0001; l+=1) arr.push(l);
  return arr;
}

function defaultMatchOdds(){
  return { result:{A:2.00, Draw:3.20, B:2.00}, ou:{}, cs:{} };
}
function defaultPlayers(){
  const a={}, b={};
  TEAM_A_PLAYERS.forEach(p=>a[p]=5.00);
  TEAM_B_PLAYERS.forEach(p=>b[p]=5.00);
  return {A:a, B:b};
}

let state = {
  main: defaultMatchOdds(),
  round1: defaultMatchOdds(),
  round2: defaultMatchOdds(),
  round3: defaultMatchOdds(),
  players: defaultPlayers(),
  penalty: {yes:3.50, no:1.25},
  custom: [],
  bets: []
};

let isAdmin = false;

/* ============================= STORAGE (GitHub Gist backend) =============================
   Data is stored as ONE JSON blob in a single gist file, so every save writes the whole
   state object in one API call (avoids GitHub rate limits and keeps writes atomic-ish).

   SETUP — do this before you deploy the page:
     1. Create a gist at https://gist.github.com with one file named exactly
        "astro365-data.json" and initial content: {}
     2. Create a GitHub Personal Access Token scoped ONLY to "gist"
        (classic token: check just the "gist" box — no repo access).
     3. Paste the gist ID and token below.

   ⚠️ SECURITY: this token ships inside the page's JS, so anyone who opens this page and
   views source can read it and use it to write to that gist. Because guests (not just the
   admin) need to save bets, everyone who has the link effectively has that write access.
   Only use a token scoped to nothing but this one gist, and only share the link with
   people you trust. There is no way to fully hide a secret in a page that has no server —
   if you need real access control, a small serverless proxy holding the token is the fix.
============================================================================================ */
const GIST_ID = "https://gist.github.com/trieuviett/7c37e2bea9e2144ded672b35cbd5c367.js";
const GITHUB_TOKEN = "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";
const GIST_FILENAME = "astro365-data.json";
const GITHUB_API = `https://api.github.com/gists/${GIST_ID}`;

const KEYS_LIST = ['main','round1','round2','round3','players','penalty','custom','bets'];

function setSyncStatus(kind, text){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (kind ? ' '+kind : '');
}

async function fetchRemoteState(){
  const res = await fetch(GITHUB_API, {
    headers: {
      "Authorization": `token ${GITHUB_TOKEN}`,
      "Accept": "application/vnd.github+json"
    }
  });
  if(!res.ok) throw new Error("GitHub fetch failed: "+res.status);
  const gist = await res.json();
  const file = gist.files && gist.files[GIST_FILENAME];
  if(!file || !file.content) return {};
  try{ return JSON.parse(file.content); }catch(e){ return {}; }
}

async function writeRemoteState(fullState){
  const res = await fetch(GITHUB_API, {
    method: "PATCH",
    headers: {
      "Authorization": `token ${GITHUB_TOKEN}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      files: { [GIST_FILENAME]: { content: JSON.stringify(fullState, null, 2) } }
    })
  });
  if(!res.ok) throw new Error("GitHub save failed: "+res.status);
  return res.json();
}

async function loadAll(){
  try{
    setSyncStatus(null, 'syncing…');
    const remote = await fetchRemoteState();
    KEYS_LIST.forEach(stateKey=>{
      if(remote[stateKey] !== undefined) state[stateKey] = remote[stateKey];
    });
    setSyncStatus('ok', 'synced');
  }catch(e){
    console.error(e);
    setSyncStatus('err', 'sync failed');
    showToast("Couldn't load saved data — check Gist ID / token");
  }

  // defensive normalization in case any saved value has a partial/unexpected shape
  ['main','round1','round2','round3'].forEach(normalizeMatchData);
  if(!state.players || typeof state.players!=='object' || !state.players.A || !state.players.B){
    state.players = defaultPlayers();
  } else {
    const defP = defaultPlayers();
    TEAM_A_PLAYERS.forEach(p=>{ if(typeof state.players.A[p]!=='number') state.players.A[p]=defP.A[p]; });
    TEAM_B_PLAYERS.forEach(p=>{ if(typeof state.players.B[p]!=='number') state.players.B[p]=defP.B[p]; });
  }
  if(!state.penalty || typeof state.penalty!=='object' || typeof state.penalty.yes!=='number' || typeof state.penalty.no!=='number'){
    state.penalty = {yes:3.50, no:1.25};
  }
  if(!Array.isArray(state.custom)) state.custom = [];
  if(!Array.isArray(state.bets)) state.bets = [];
}

// Simple queue so overlapping saveKey() calls don't race each other against the gist API.
let saveChain = Promise.resolve();

function saveKey(stateKey){
  saveChain = saveChain.then(async ()=>{
    try{
      setSyncStatus(null, 'saving…');
      // Re-fetch latest remote first so we don't clobber other people's concurrent
      // changes to the OTHER keys. This is a simple merge, not a true transaction —
      // two people saving the exact same key at the exact same instant can still
      // race (last write wins on that one key) but other sections stay intact.
      const remote = await fetchRemoteState();
      remote[stateKey] = state[stateKey];
      await writeRemoteState(remote);
      setSyncStatus('ok', 'synced');
    }catch(e){
      console.error(e);
      setSyncStatus('err', 'save failed');
      showToast("Save failed — check connection/token");
    }
  });
  return saveChain;
}

/* ============================= UTIL ============================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmt(n){ return Number(n).toFixed(2); }
function getName(){
  const n = document.getElementById('nameInput').value.trim();
  return n || "Anonymous";
}

function getUserTotalStake(name){
  return state.bets.filter(b=>b.user===name).reduce((sum,b)=>sum+b.stake,0);
}

function placeBet(sectionLabel, description, odds, stakeInputEl){
  const stake = parseFloat(stakeInputEl.value);
  if(!stake || stake<=0){ showToast("Enter a stake first"); return; }
  if(!odds || odds<=0){ showToast("No odds set for this yet"); return; }
  const name = getName();
  const used = getUserTotalStake(name);
  const remaining = STAKE_LIMIT - used;
  if(stake > remaining){
    showToast(`Stake limit reached — ${name} has ${fmt(remaining>0?remaining:0)} pt left of the ${STAKE_LIMIT} pt limit`);
    return;
  }
  const bet = {
    id: 'b'+Date.now()+Math.random().toString(16).slice(2),
    time: new Date().toLocaleString(),
    user: name,
    section: sectionLabel,
    description,
    odds,
    stake,
    potential: stake*odds
  };
  state.bets.unshift(bet);
  saveKey('bets');
  stakeInputEl.value = '';
  showToast(`Bet placed: ${description} for ${stake} pt`);
  renderBets();
  renderStakeSummary();
  updateMyLimitInfo();
}

function renderStakeSummary(){
  const el = document.getElementById('stakeSummary');
  if(!el) return;
  const totals = {};
  state.bets.forEach(b=>{ totals[b.user] = (totals[b.user]||0) + b.stake; });
  const names = Object.keys(totals).sort();
  if(names.length===0){
    el.innerHTML = `<span class="limit-chip quiet">Stake limit: ${STAKE_LIMIT} pt per name — no bets placed yet.</span>`;
    return;
  }
  el.innerHTML = names.map(n=>{
    const used = totals[n];
    const maxed = used>=STAKE_LIMIT;
    return `<span class="limit-chip${maxed?' maxed':''}">${n}: ${fmt(used)} / ${STAKE_LIMIT} pt</span>`;
  }).join('');
}

function updateMyLimitInfo(){
  const el = document.getElementById('myLimitInfo');
  if(!el) return;
  const name = getName();
  const used = getUserTotalStake(name);
  const remaining = Math.max(0, STAKE_LIMIT-used);
  el.textContent = `${name}: ${fmt(used)}/${STAKE_LIMIT} pt used (${fmt(remaining)} left)`;
}

/* ============================= RENDER: MATCH BLOCK (result + ou + cs) ============================= */
function normalizeMatchData(sectionKey){
  const def = defaultMatchOdds();
  const data = state[sectionKey] && typeof state[sectionKey]==='object' ? state[sectionKey] : {};
  if(!data.result || typeof data.result!=='object') data.result = def.result;
  ['A','Draw','B'].forEach(k=>{ if(typeof data.result[k]!=='number' || isNaN(data.result[k])) data.result[k]=def.result[k]; });
  if(!data.ou || typeof data.ou!=='object') data.ou = {};
  if(!data.cs || typeof data.cs!=='object') data.cs = {};
  state[sectionKey] = data;
}

function renderMatchBlock(containerEl, sectionKey, label, ouLimit){
  normalizeMatchData(sectionKey);
  const data = state[sectionKey];
  containerEl.innerHTML = '';

  // RESULT
  const resultCard = document.createElement('div');
  resultCard.className='card';
  resultCard.innerHTML = `<h2>${label} — Match Result</h2>`;
  const grid = document.createElement('div');
  grid.className='result-grid';
  [['A','Team A Win'],['Draw','Draw'],['B','Team B Win']].forEach(([k,lbl])=>{
    const cell = document.createElement('div');
    cell.className='result-cell';
    const oddVal = data.result[k];
    cell.innerHTML = `<div class="rc-title">${lbl}</div>`;
    const row = document.createElement('div');
    row.style.display='flex'; row.style.gap='8px'; row.style.alignItems='center';
    if(isAdmin){
      row.innerHTML = `<input class="odd-edit" type="number" step="0.01" min="1" value="${fmt(oddVal)}">`;
      const inp = row.querySelector('input');
      inp.addEventListener('change', ()=>{
        data.result[k] = parseFloat(inp.value)||oddVal;
        saveKey(sectionKey);
        showToast('Odds updated');
      });
    } else {
      const stakeWrap = document.createElement('div');
      stakeWrap.className='stake-group';
      stakeWrap.innerHTML = `<span class="odd-value">${fmt(oddVal)}</span><input type="number" min="1" max="100" placeholder="Stake"><button>Bet</button>`;
      const stakeInp = stakeWrap.querySelector('input');
      const btn = stakeWrap.querySelector('button');
      btn.addEventListener('click', ()=>placeBet(label, lbl, oddVal, stakeInp));
      row.appendChild(stakeWrap);
    }
    cell.appendChild(row);
    grid.appendChild(cell);
  });
  resultCard.appendChild(grid);
  containerEl.appendChild(resultCard);

  // OVER/UNDER
  const ouCard = document.createElement('div');
  ouCard.className='card';
  ouCard.innerHTML = `<h2>${label} — Goals Over / Under</h2><div class="hint">Lines from 0.5 up to ${ouLimit} goals.</div>`;
  const table = document.createElement('table');
  table.className='ou-table';
  table.innerHTML = `<thead><tr><th>Line</th><th>Over</th><th>Under</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  ouLines(ouLimit).forEach(line=>{
    const key = String(line);
    if(!data.ou[key]) data.ou[key] = {over:1.90, under:1.90};
    const entry = data.ou[key];
    const tr = document.createElement('tr');
    const tdLine = document.createElement('td');
    tdLine.textContent = line;
    tdLine.style.fontFamily="'Consolas',monospace"; tdLine.style.color='var(--gold-bright)';
    tr.appendChild(tdLine);
    ['over','under'].forEach(side=>{
      const td = document.createElement('td');
      if(isAdmin){
        td.innerHTML = `<input class="odd-edit" type="number" step="0.01" min="1" value="${fmt(entry[side])}">`;
        const inp = td.querySelector('input');
        inp.addEventListener('change', ()=>{
          entry[side] = parseFloat(inp.value)||entry[side];
          saveKey(sectionKey);
          showToast('Odds updated');
        });
      } else {
        td.innerHTML = `<div class="stake-group"><span class="odd-value">${fmt(entry[side])}</span><input type="number" min="1" max="100" placeholder="Stake"><button>Bet</button></div>`;
        const stakeInp = td.querySelector('input');
        const btn = td.querySelector('button');
        btn.addEventListener('click', ()=>placeBet(label, `${side==='over'?'Over':'Under'} ${line} goals`, entry[side], stakeInp));
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  ouCard.appendChild(table);
  containerEl.appendChild(ouCard);

  // CORRECT SCORE
  const csCard = document.createElement('div');
  csCard.className='card';
  csCard.innerHTML = `<h2>${label} — Correct Score</h2><div class="hint">Team A goals : Team B goals — up to ${MAX_GOALS} goals per team.</div>`;
  const picker = document.createElement('div');
  picker.className='cs-picker';
  const selA = document.createElement('select');
  const selB = document.createElement('select');
  for(let i=0;i<=MAX_GOALS;i++){
    selA.innerHTML += `<option value="${i}">${i}</option>`;
    selB.innerHTML += `<option value="${i}">${i}</option>`;
  }
  const wrapA = document.createElement('div'); wrapA.innerHTML=`<label>Team A goals</label>`; wrapA.appendChild(selA);
  const wrapB = document.createElement('div'); wrapB.innerHTML=`<label>Team B goals</label>`; wrapB.appendChild(selB);
  picker.appendChild(wrapA); picker.appendChild(wrapB);

  // Use direct element references throughout instead of getElementById — nodes here
  // are still detached from the document while being built, so id-based lookups
  // are unreliable until the whole card is appended.
  const actionWrap = document.createElement('div');
  let csOddInput = null, csBetOddSpan = null;

  if(isAdmin){
    actionWrap.innerHTML = `<label>Odds</label><input class="odd-edit" type="number" step="0.01" min="1" value="6.00"><button style="margin-left:6px;">Set odds</button>`;
    csOddInput = actionWrap.querySelector('input');
    const setBtn = actionWrap.querySelector('button');
    setBtn.addEventListener('click', ()=>{
      const key = `${selA.value}-${selB.value}`;
      const v = parseFloat(csOddInput.value);
      if(!v || v<=0){ showToast('Enter a valid odd'); return; }
      data.cs[key] = v;
      saveKey(sectionKey);
      showToast(`Score ${selA.value}:${selB.value} set to ${fmt(v)}`);
      renderCsChips();
    });
  } else {
    actionWrap.innerHTML = `<label>&nbsp;</label><div class="stake-group"><span class="odd-value empty">select score</span><input type="number" min="1" max="${STAKE_LIMIT}" placeholder="Stake"><button>Bet</button></div>`;
    const stakeGroup = actionWrap.querySelector('.stake-group');
    csBetOddSpan = stakeGroup.querySelector('.odd-value');
    const csBetStakeInp = stakeGroup.querySelector('input');
    const betBtn = stakeGroup.querySelector('button');
    function refreshCsOdd(){
      const key = `${selA.value}-${selB.value}`;
      const odd = data.cs[key];
      if(odd){ csBetOddSpan.textContent = fmt(odd); csBetOddSpan.classList.remove('empty'); }
      else { csBetOddSpan.textContent='not set'; csBetOddSpan.classList.add('empty'); }
    }
    selA.addEventListener('change', refreshCsOdd);
    selB.addEventListener('change', refreshCsOdd);
    refreshCsOdd();
    betBtn.addEventListener('click', ()=>{
      const key = `${selA.value}-${selB.value}`;
      const odd = data.cs[key];
      placeBet(label, `Correct score ${selA.value}:${selB.value}`, odd, csBetStakeInp);
    });
  }
  picker.appendChild(actionWrap);
  csCard.appendChild(picker);

  const chipWrap = document.createElement('div');
  chipWrap.className='cs-chip-wrap';
  csCard.appendChild(chipWrap);

  function renderCsChips(){
    const keys = Object.keys(data.cs);
    if(keys.length===0){
      chipWrap.innerHTML = `<span class="empty-note">No correct-score odds set yet.</span>`;
      return;
    }
    chipWrap.innerHTML='';
    keys.sort((x,y)=>{
      const [xa,xb]=x.split('-').map(Number), [ya,yb]=y.split('-').map(Number);
      return (xa+xb)-(ya+yb) || xa-ya;
    }).forEach(k=>{
      const [a,b] = k.split('-');
      const chip = document.createElement('div');
      chip.className='cs-chip';
      chip.innerHTML = `${a}:${b} <b>${fmt(data.cs[k])}</b>`;
      chip.title = isAdmin ? 'Click to load into editor' : 'Click to select this score';
      chip.addEventListener('click', ()=>{
        selA.value=a; selB.value=b;
        if(isAdmin){
          if(csOddInput) csOddInput.value = fmt(data.cs[k]);
        } else if(csBetOddSpan){
          csBetOddSpan.textContent = fmt(data.cs[k]);
          csBetOddSpan.classList.remove('empty');
        }
      });
      chipWrap.appendChild(chip);
    });
  }
  renderCsChips();
  containerEl.appendChild(csCard);
}

/* ============================= RENDER: PLAYERS ============================= */
function renderPlayers(containerEl){
  containerEl.innerHTML = '';
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<h2>Player to Score</h2><div class="hint">Anytime goalscorer odds for each player, across all rounds.${isAdmin?' Rename, re-price, add, or remove a player below.':''}</div>`;
  const cols = document.createElement('div');
  cols.className='players-cols';

  function buildCol(teamKey, teamLabel, colClass){
    const col = document.createElement('div');
    col.className = 'players-col '+colClass;
    col.innerHTML = `<h3>${teamLabel}</h3>`;
    Object.keys(state.players[teamKey]).forEach(name=>{
      const odd = state.players[teamKey][name];
      const row = document.createElement('div');
      row.className='odd-row';
      if(isAdmin){
        row.innerHTML = `<input class="odd-edit player-name-edit" type="text" value="${name}" style="width:120px; text-align:left;">
          <input class="odd-edit" type="number" step="0.01" min="1" value="${fmt(odd)}">
          <button class="row-remove" title="Remove player">✕</button>`;
        const nameInp = row.querySelector('.player-name-edit');
        const oddInp = row.querySelectorAll('input')[1];
        nameInp.addEventListener('change', ()=>{
          const newName = nameInp.value.trim();
          if(!newName){ nameInp.value=name; return; }
          if(newName===name) return;
          if(state.players[teamKey][newName]!==undefined){ showToast('That name already exists'); nameInp.value=name; return; }
          const val = state.players[teamKey][name];
          delete state.players[teamKey][name];
          state.players[teamKey][newName] = val;
          saveKey('players');
          showToast('Player renamed');
          renderPlayers(containerEl);
        });
        oddInp.addEventListener('change', ()=>{
          state.players[teamKey][name] = parseFloat(oddInp.value)||odd;
          saveKey('players');
          showToast('Odds updated');
        });
        row.querySelector('.row-remove').addEventListener('click', ()=>{
          delete state.players[teamKey][name];
          saveKey('players');
          showToast('Player removed');
          renderPlayers(containerEl);
        });
      } else {
        row.innerHTML = `<span class="odd-label">${name}</span>`;
        const g = document.createElement('div');
        g.className='stake-group';
        g.innerHTML = `<span class="odd-value">${fmt(odd)}</span><input type="number" min="1" max="${STAKE_LIMIT}" placeholder="Stake"><button>Bet</button>`;
        g.querySelector('button').addEventListener('click', ()=>placeBet('Player to Score', `${name} (${teamLabel}) to score`, odd, g.querySelector('input')));
        row.appendChild(g);
      }
      col.appendChild(row);
    });
    if(isAdmin){
      const addRow = document.createElement('div');
      addRow.className='custom-add';
      addRow.style.marginTop='10px';
      addRow.innerHTML = `<input type="text" placeholder="New player name" style="flex:1 1 120px;">
        <input class="odd-edit" type="number" step="0.01" min="1" value="5.00" style="width:66px;">
        <button>Add player</button>`;
      const nameEl = addRow.querySelector('input[type=text]');
      const oddEl = addRow.querySelector('input[type=number]');
      addRow.querySelector('button').addEventListener('click', ()=>{
        const nm = nameEl.value.trim();
        const od = parseFloat(oddEl.value);
        if(!nm){ showToast('Enter a player name'); return; }
        if(state.players[teamKey][nm]!==undefined){ showToast('That player already exists'); return; }
        state.players[teamKey][nm] = od>0?od:5.00;
        saveKey('players');
        showToast('Player added');
        renderPlayers(containerEl);
      });
      col.appendChild(addRow);
    }
    return col;
  }
  cols.appendChild(buildCol('A','Team A','a'));
  cols.appendChild(buildCol('B','Team B','b'));
  card.appendChild(cols);
  containerEl.appendChild(card);
}

/* ============================= RENDER: PENALTY ============================= */
function renderPenalty(containerEl){
  containerEl.innerHTML='';
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<h2>Penalty Awarded</h2><div class="hint">Will there be at least one penalty in the match?</div>`;
  const grid = document.createElement('div');
  grid.className='result-grid';
  [['yes','Yes, penalty given'],['no','No penalty']].forEach(([k,lbl])=>{
    const cell = document.createElement('div');
    cell.className='result-cell';
    cell.innerHTML = `<div class="rc-title">${lbl}</div>`;
    const odd = state.penalty[k];
    if(isAdmin){
      cell.innerHTML += `<input class="odd-edit" type="number" step="0.01" min="1" value="${fmt(odd)}">`;
      const inp = cell.querySelector('input');
      inp.addEventListener('change', ()=>{
        state.penalty[k]=parseFloat(inp.value)||odd;
        saveKey('penalty');
        showToast('Odds updated');
      });
    } else {
      const g = document.createElement('div');
      g.className='stake-group';
      g.innerHTML = `<span class="odd-value">${fmt(odd)}</span><input type="number" min="1" max="100" placeholder="Stake"><button>Bet</button>`;
      g.querySelector('button').addEventListener('click', ()=>placeBet('Penalty', lbl, odd, g.querySelector('input')));
      cell.appendChild(g);
    }
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  containerEl.appendChild(card);
}

/* ============================= RENDER: CUSTOM ============================= */
function renderCustom(containerEl){
  containerEl.innerHTML='';
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<h2>Custom Bets</h2><div class="hint">Anything else worth a bet — admin adds it, everyone can back it.</div>`;

  if(isAdmin){
    const addRow = document.createElement('div');
    addRow.className='custom-add';
    addRow.innerHTML = `<input type="text" id="customName" placeholder="e.g. First goal before 5 min">
      <input class="odd-edit" type="number" step="0.01" min="1" id="customOdd" placeholder="Odds" style="width:80px;">
      <button id="customAddBtn">Add bet</button>`;
    card.appendChild(addRow);
    addRow.querySelector('#customAddBtn').addEventListener('click', ()=>{
      const nameEl = document.getElementById('customName');
      const oddEl = document.getElementById('customOdd');
      const name = nameEl.value.trim();
      const odd = parseFloat(oddEl.value);
      if(!name || !odd || odd<=0){ showToast('Enter a name and valid odds'); return; }
      state.custom.push({id:'c'+Date.now(), name, odd});
      saveKey('custom');
      nameEl.value=''; oddEl.value='';
      renderCustom(containerEl);
      showToast('Custom bet added');
    });
  }

  if(state.custom.length===0){
    const p = document.createElement('div');
    p.className='empty-note';
    p.style.padding='6px 0';
    p.textContent = 'No custom bets yet.';
    card.appendChild(p);
  } else {
    state.custom.forEach(item=>{
      const row = document.createElement('div');
      row.className='odd-row';
      row.innerHTML = `<span class="odd-label">${item.name}</span>`;
      if(isAdmin){
        row.innerHTML += `<input class="odd-edit" type="number" step="0.01" min="1" value="${fmt(item.odd)}">
          <button class="row-remove" title="Remove">✕</button>`;
        const inp = row.querySelector('input');
        inp.addEventListener('change', ()=>{
          item.odd = parseFloat(inp.value)||item.odd;
          saveKey('custom');
          showToast('Odds updated');
        });
        row.querySelector('.row-remove').addEventListener('click', ()=>{
          state.custom = state.custom.filter(c=>c.id!==item.id);
          saveKey('custom');
          renderCustom(containerEl);
        });
      } else {
        const g = document.createElement('div');
        g.className='stake-group';
        g.innerHTML = `<span class="odd-value">${fmt(item.odd)}</span><input type="number" min="1" max="100" placeholder="Stake"><button>Bet</button>`;
        g.querySelector('button').addEventListener('click', ()=>placeBet('Custom', item.name, item.odd, g.querySelector('input')));
        row.appendChild(g);
      }
      card.appendChild(row);
    });
  }
  containerEl.appendChild(card);
}

/* ============================= RENDER: BET HISTORY ============================= */
function renderBets(){
  const containerEl = document.getElementById('panel-bets');
  if(!containerEl) return;
  containerEl.innerHTML='';
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<h2>Bet History</h2><div class="hint">${isAdmin?'Every bet placed by everyone, newest first.':'Every bet placed, newest first — names and stakes stay private. You can delete your own bets below.'}</div>`;
  if(state.bets.length===0){
    card.innerHTML += `<div class="empty-note">No bets placed yet — go find some odds.</div>`;
  } else {
    const myName = getName().trim().toLowerCase();
    const table = document.createElement('table');
    table.className='bets';
    table.innerHTML = isAdmin
      ? `<thead><tr><th>Time</th><th>Bettor</th><th>Section</th><th>Pick</th><th>Odds</th><th>Stake</th><th>Potential win</th><th></th></tr></thead>`
      : `<thead><tr><th>Time</th><th>Section</th><th>Pick</th><th>Odds</th><th>Potential win</th><th></th></tr></thead>`;
    const tbody = document.createElement('tbody');
    state.bets.forEach(b=>{
      const tr = document.createElement('tr');
      tr.innerHTML = isAdmin
        ? `<td>${b.time}</td><td>${b.user}</td><td>${b.section}</td><td>${b.description}</td><td>${fmt(b.odds)}</td><td>${fmt(b.stake)}</td><td>${fmt(b.potential)}</td>`
        : `<td>${b.time}</td><td>${b.section}</td><td>${b.description}</td><td>${fmt(b.odds)}</td><td>${fmt(b.potential)}</td>`;
      const isMine = b.user.trim().toLowerCase() === myName;
      if(isAdmin || isMine){
        const td = document.createElement('td');
        const rm = document.createElement('button');
        rm.className='row-remove'; rm.textContent='✕'; rm.title = isAdmin ? 'Delete bet' : 'Delete your bet';
        rm.addEventListener('click', ()=>{
          state.bets = state.bets.filter(x=>x.id!==b.id);
          saveKey('bets');
          renderBets();
          renderStakeSummary();
          updateMyLimitInfo();
        });
        td.appendChild(rm);
        tr.appendChild(td);
      } else {
        tr.appendChild(document.createElement('td'));
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
  }
  containerEl.appendChild(card);
}

/* ============================= TABS ============================= */
const TABS = [
  {id:'main', label:'Main Match'},
  {id:'round1', label:'Round 1'},
  {id:'round2', label:'Round 2'},
  {id:'round3', label:'Round 3'},
  {id:'players', label:'Player to Score'},
  {id:'penalty', label:'Penalty'},
  {id:'custom', label:'Custom Bets'},
  {id:'bets', label:'Bet History'},
];

function buildTabsAndPanels(){
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  tabsEl.innerHTML=''; panelsEl.innerHTML='';
  TABS.forEach((t,i)=>{
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    if(i===0) btn.classList.add('active');
    btn.addEventListener('click', ()=>switchTab(t.id));
    tabsEl.appendChild(btn);

    const panel = document.createElement('section');
    panel.className = 'panel'+(i===0?' active':'');
    panel.id = 'panel-'+t.id;
    panelsEl.appendChild(panel);
  });
}

function switchTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
}

function safeRender(fn, containerEl, label){
  try{
    fn();
  }catch(e){
    console.error(`Render error in ${label}:`, e);
    if(containerEl){
      containerEl.innerHTML = `<div class="card"><h2>${label}</h2>
        <div class="empty-note">Something went wrong loading this tab. Try refreshing the page — if it keeps happening, an admin may need to reset this section's odds.</div></div>`;
    }
  }
}

function renderAll(){
  safeRender(()=>renderMatchBlock(document.getElementById('panel-main'), 'main', 'Main Match', MAIN_OU_LIMIT), document.getElementById('panel-main'), 'Main Match');
  safeRender(()=>renderMatchBlock(document.getElementById('panel-round1'), 'round1', 'Round 1', ROUND_OU_LIMIT), document.getElementById('panel-round1'), 'Round 1');
  safeRender(()=>renderMatchBlock(document.getElementById('panel-round2'), 'round2', 'Round 2', ROUND_OU_LIMIT), document.getElementById('panel-round2'), 'Round 2');
  safeRender(()=>renderMatchBlock(document.getElementById('panel-round3'), 'round3', 'Round 3', ROUND_OU_LIMIT), document.getElementById('panel-round3'), 'Round 3');
  safeRender(()=>renderPlayers(document.getElementById('panel-players')), document.getElementById('panel-players'), 'Player to Score');
  safeRender(()=>renderPenalty(document.getElementById('panel-penalty')), document.getElementById('panel-penalty'), 'Penalty');
  safeRender(()=>renderCustom(document.getElementById('panel-custom')), document.getElementById('panel-custom'), 'Custom Bets');
  safeRender(()=>renderBets(), document.getElementById('panel-bets'), 'Bet History');
}

/* ============================= LOGIN ============================= */
function updateModeUI(){
  const badge = document.getElementById('modeBadge');
  badge.textContent = isAdmin ? 'Admin mode' : 'Guest view';
  badge.className = 'badge '+(isAdmin?'admin':'guest');
  document.getElementById('loginBtn').style.display = isAdmin ? 'none' : 'inline-block';
  document.getElementById('logoutBtn').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('adminCode').style.display = isAdmin ? 'none' : 'inline-block';
}

document.getElementById('loginBtn').addEventListener('click', ()=>{
  const code = document.getElementById('adminCode').value;
  if(code === ADMIN_CODE){
    isAdmin = true;
    document.getElementById('adminCode').value='';
    updateModeUI();
    renderAll();
    showToast('Logged in as admin');
  } else {
    showToast('Wrong code');
  }
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  isAdmin = false;
  updateModeUI();
  renderAll();
  showToast('Logged out');
});
document.getElementById('adminCode').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') document.getElementById('loginBtn').click();
});

/* ============================= INIT ============================= */
document.getElementById('nameInput').addEventListener('input', ()=>{ updateMyLimitInfo(); renderBets(); });

async function init(){
  buildTabsAndPanels();
  updateModeUI();
  await loadAll();
  renderAll();
  renderStakeSummary();
  updateMyLimitInfo();
}
init();
</script>
